name: Atualizar notícias do Corinthians

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Atualizar snapshot do RSS
        run: python3 atualizar-noticias.py
      - name: Publicar alterações no snapshot
        run: |
          if git diff --quiet -- noticias.json; then
            echo "O feed não trouxe mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Atualiza notícias do Corinthians"
          git push
